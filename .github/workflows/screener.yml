name: Screener

on:
  repository_dispatch:
    types: [run-screener]
  schedule:
    - cron: '30 23 * * 0-4'   # NSE Daily Breakout    — 5:00 AM IST Mon–Fri
    - cron: '45 23 * * 0-4'   # NSE Weekly Breakout   — 5:15 AM IST Mon–Fri
    - cron: '15 0 * * 1-5'    # NYSE Daily Breakout   — 5:45 AM IST Mon–Fri
    - cron: '30 0 * * 1-5'    # NYSE Daily Pullback   — 6:00 AM IST Mon–Fri
    - cron: '45 0 * * 1-5'    # NSE Daily Pullback    — 6:15 AM IST Mon–Fri
    - cron: '0 1 * * 1-5'     # NSE Weekly Pullback   — 6:30 AM IST Mon–Fri

permissions:
  contents: write

jobs:

  run-screener:
    if: github.event_name == 'repository_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r backend/requirements.txt
      - name: Run screener
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SCREENER_MARKET: ${{ github.event.client_payload.market }}
          SCREENER_LOGIC: ${{ github.event.client_payload.logic }}
          SCREENER_TIMEFRAME: ${{ github.event.client_payload.timeframe }}
          SCREENER_PARAMS: ${{ github.event.client_payload.params }}
        run: |
          python backend/screener_dispatcher.py \
            --market "$SCREENER_MARKET" \
            --logic "$SCREENER_LOGIC" \
            --timeframe "$SCREENER_TIMEFRAME" \
            --params "$SCREENER_PARAMS"
      - name: Commit results
        run: |
          if [ -z "$(git status --short backend/results)" ]; then
            echo "No result changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f backend/results
          git commit -m "Add screener results"
          git pull --rebase origin main
          git push

  scheduled-nse-daily-breakout:
    if: github.event_name == 'schedule' && github.event.schedule == '30 23 * * 0-4'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r backend/requirements.txt
      - name: Run NSE Daily Breakout (Pure Only)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python backend/screener_dispatcher.py \
            --market "NSE" --logic "breakout" --timeframe "daily" \
            --params '{"max_failed_attempts": 0}'
      - name: Commit results
        run: |
          if [ -z "$(git status --short backend/results)" ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f backend/results
          git commit -m "Scheduled: NSE daily breakout (pure)"
          git pull --rebase origin main
          git push

  scheduled-nse-weekly-breakout:
    if: github.event_name == 'schedule' && github.event.schedule == '45 23 * * 0-4'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r backend/requirements.txt
      - name: Run NSE Weekly Breakout (Pure Only)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python backend/screener_dispatcher.py \
            --market "NSE" --logic "breakout" --timeframe "weekly" \
            --params '{"max_failed_attempts": 0}'
      - name: Commit results
        run: |
          if [ -z "$(git status --short backend/results)" ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f backend/results
          git commit -m "Scheduled: NSE weekly breakout (pure)"
          git pull --rebase origin main
          git push

  scheduled-nyse-daily-breakout:
    if: github.event_name == 'schedule' && github.event.schedule == '15 0 * * 1-5'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r backend/requirements.txt
      - name: Run NYSE Daily Breakout (Pure Only)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python backend/screener_dispatcher.py \
            --market "NYSE" --logic "breakout" --timeframe "daily" \
            --params '{"max_failed_attempts": 0}'
      - name: Commit results
        run: |
          if [ -z "$(git status --short backend/results)" ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f backend/results
          git commit -m "Scheduled: NYSE daily breakout (pure)"
          git pull --rebase origin main
          git push

  scheduled-nyse-daily-pullback:
    if: github.event_name == 'schedule' && github.event.schedule == '30 0 * * 1-5'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r backend/requirements.txt
      - name: Run NYSE Daily Pullback (Pure Only)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python backend/screener_dispatcher.py \
            --market "NYSE" --logic "pullback" --timeframe "daily" \
            --params '{"max_brief_crosses": 3}'
      - name: Commit results
        run: |
          if [ -z "$(git status --short backend/results)" ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f backend/results
          git commit -m "Scheduled: NYSE daily pullback (pure)"
          git pull --rebase origin main
          git push

  scheduled-nse-daily-pullback:
    if: github.event_name == 'schedule' && github.event.schedule == '45 0 * * 1-5'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r backend/requirements.txt
      - name: Run NSE Daily Pullback (Pure Only)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python backend/screener_dispatcher.py \
            --market "NSE" --logic "pullback" --timeframe "daily" \
            --params '{"max_brief_crosses": 3}'
      - name: Commit results
        run: |
          if [ -z "$(git status --short backend/results)" ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f backend/results
          git commit -m "Scheduled: NSE daily pullback (pure)"
          git pull --rebase origin main
          git push

  scheduled-nse-weekly-pullback:
    if: github.event_name == 'schedule' && github.event.schedule == '0 1 * * 1-5'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r backend/requirements.txt
      - name: Run NSE Weekly Pullback (Pure Only)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python backend/screener_dispatcher.py \
            --market "NSE" --logic "pullback" --timeframe "weekly" \
            --params '{"max_failed_attempts": 0}'
      - name: Commit results
        run: |
          if [ -z "$(git status --short backend/results)" ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f backend/results
          git commit -m "Scheduled: NSE weekly pullback (pure)"
          git pull --rebase origin main
          git push
