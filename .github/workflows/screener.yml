name: Screener

on:
  repository_dispatch:
    types: [run-screener]
  schedule:
    - cron: '0 2 * * 1-5'   # NSE Daily Breakout  — 07:30 IST Mon–Fri
    - cron: '15 2 * * 1-5'  # NSE Weekly Breakout — 07:45 IST Mon–Fri

permissions:
  contents: write

jobs:

  run-screener:
    if: github.event_name == 'repository_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Run screener
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SCREENER_MARKET: ${{ github.event.client_payload.market }}
          SCREENER_LOGIC: ${{ github.event.client_payload.logic }}
          SCREENER_TIMEFRAME: ${{ github.event.client_payload.timeframe }}
          SCREENER_PARAMS: ${{ github.event.client_payload.params }}
        run: |
          python backend/screener_dispatcher.py \
            --market "$SCREENER_MARKET" \
            --logic "$SCREENER_LOGIC" \
            --timeframe "$SCREENER_TIMEFRAME" \
            --params "$SCREENER_PARAMS"
      - name: Commit results
        run: |
          if [ -z "$(git status --short backend/results)" ]; then
            echo "No result changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f backend/results
          git commit -m "Add screener results"
          git pull --rebase origin main
          git push

  scheduled-nse-daily-breakout:
    if: github.event_name == 'schedule' && github.event.schedule == '0 2 * * 1-5'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r backend/requirements.txt
      - name: Run NSE Daily Breakout
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python backend/screener_dispatcher.py \
            --market "NSE" --logic "breakout" --timeframe "daily" --params '{}'
      - name: Commit results
        run: |
          if [ -z "$(git status --short backend/results)" ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f backend/results
          git commit -m "Scheduled: NSE daily breakout"
          git pull --rebase origin main
          git push

  scheduled-nse-weekly-breakout:
    if: github.event_name == 'schedule' && github.event.schedule == '15 2 * * 1-5'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r backend/requirements.txt
      - name: Run NSE Weekly Breakout
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python backend/screener_dispatcher.py \
            --market "NSE" --logic "breakout" --timeframe "weekly" --params '{}'
      - name: Commit results
        run: |
          if [ -z "$(git status --short backend/results)" ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f backend/results
          git commit -m "Scheduled: NSE weekly breakout"
          git pull --rebase origin main
          git push
